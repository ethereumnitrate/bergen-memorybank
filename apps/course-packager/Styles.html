<style>
  :root {
    color-scheme: light;
    --bergen-blue: #003f72;
    --bergen-blue-dark: #002c51;
    --bergen-gold: #f6c344;
    --ink: #17212b;
    --muted: #536170;
    --paper: #ffffff;
    --canvas: #f3f6f8;
    --border: #c8d2dc;
    --success: #176b43;
    font-family: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.55;
  }

  .page-width {
    width: min(100% - 2rem, 960px);
    margin-inline: auto;
  }

  .site-header {
    border-bottom: 0.35rem solid var(--bergen-gold);
    background: var(--bergen-blue);
    color: white;
    padding: 2.4rem 0 2rem;
  }

  .eyebrow, .step-label {
    margin: 0 0 0.25rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1, h2, p { margin-top: 0; }
  h1 { margin-bottom: 0.35rem; font-size: clamp(2rem, 6vw, 3.35rem); line-height: 1.05; }
  h2 { line-height: 1.2; }
  .subtitle { max-width: 48rem; margin-bottom: 0; font-size: 1.08rem; }

  main { padding-block: 1.5rem 3rem; }

  .privacy-banner, .card, .support-note, .status {
    border: 1px solid var(--border);
    border-radius: 0.65rem;
    background: var(--paper);
    box-shadow: 0 0.25rem 1rem rgb(15 36 52 / 8%);
  }

  .privacy-banner {
    display: flex;
    gap: 0.9rem;
    padding: 1rem 1.1rem;
  }

  .privacy-banner p { margin-bottom: 0; }
  .privacy-mark { color: var(--success); font-size: 1.5rem; font-weight: 800; }

  .steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.7rem;
    margin: 1.25rem 0;
    padding: 0;
    list-style: none;
  }

  .steps li {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--muted);
    font-weight: 700;
  }

  .steps span {
    display: grid;
    width: 2rem;
    height: 2rem;
    place-items: center;
    border-radius: 50%;
    background: var(--bergen-blue);
    color: white;
  }

  .card { margin-block: 1rem; padding: 1.35rem; }
  .helper { color: var(--muted); }

  label:not(.confirmation) {
    display: block;
    margin-bottom: 0.45rem;
    font-weight: 700;
  }

  textarea {
    width: 100%;
    min-height: 18rem;
    resize: vertical;
    border: 2px solid #8193a5;
    border-radius: 0.45rem;
    padding: 0.8rem;
    background: white;
    color: var(--ink);
    font: 0.92rem/1.45 Consolas, "Courier New", monospace;
  }

  textarea:focus, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--bergen-gold);
    outline-offset: 2px;
  }

  .button {
    min-height: 2.75rem;
    margin-top: 0.9rem;
    border: 0;
    border-radius: 0.4rem;
    padding: 0.65rem 1rem;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  .button.primary { background: var(--bergen-blue); color: white; }
  .button.primary:hover:not(:disabled) { background: var(--bergen-blue-dark); }
  .button:disabled { cursor: not-allowed; opacity: 0.5; }

  .confirmation {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin-block: 1.25rem;
    padding: 1rem;
    border: 2px solid var(--bergen-blue);
    border-radius: 0.45rem;
    font-weight: 700;
  }

  .confirmation input { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; }

  .download-panel {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 1.2rem;
    border-top: 1px solid var(--border);
    padding-top: 1.2rem;
  }

  .download-panel p { margin-bottom: 0; }
  .support-note, .status { margin-top: 1rem; padding: 1rem 1.1rem; }
  .status { border-left: 0.35rem solid var(--bergen-blue); font-weight: 700; }

  @media (max-width: 640px) {
    .page-width { width: min(100% - 1rem, 960px); }
    .site-header { padding-block: 1.65rem 1.4rem; }
    .steps { grid-template-columns: 1fr; }
    .card { padding: 1rem; }
    .download-panel { grid-template-columns: 1fr; }
    .download-panel .button { width: 100%; }
  }
</style>
