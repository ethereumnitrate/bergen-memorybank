<style>
  :root {
    color-scheme: light;
    --bergen-green: #1e5c45;
    --bergen-green-dark: #143f30;
    --bergen-gold: #f3c969;
    --ink: #17231d;
    --muted: #53645b;
    --line: #ccd7d1;
    --surface: #ffffff;
    --soft: #eef5f1;
    --error: #8a1c1c;
    --warning: #6f4c00;
    font-family: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7f6; color: var(--ink); line-height: 1.55; }
  button, textarea { font: inherit; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #1769aa; outline-offset: 2px; }
  .page-width { width: min(960px, calc(100% - 32px)); margin-inline: auto; }
  .site-header { background: var(--bergen-green-dark); color: #fff; padding: 28px 0; border-bottom: 5px solid var(--bergen-gold); }
  .site-header h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; }
  .eyebrow, .step-label { margin: 0 0 4px; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .subtitle { margin: 10px 0 0; max-width: 720px; }
  main { padding-block: 28px 48px; }
  .privacy-banner, .card, .support-note { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .privacy-banner { display: flex; gap: 14px; padding: 18px; border-left: 6px solid var(--bergen-green); }
  .privacy-banner h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .privacy-banner p { margin: 0; }
  .privacy-mark { display: grid; place-items: center; flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--bergen-green); color: #fff; font-weight: 700; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; list-style: none; padding: 0; margin: 22px 0; }
  .steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; }
  .steps span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--bergen-green-dark); }
  .card { padding: 24px; margin-block: 18px; box-shadow: 0 4px 14px rgba(20, 63, 48, .08); }
  .card-heading, .download-panel { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  h2 { margin: 0 0 8px; line-height: 1.25; }
  .helper { color: var(--muted); }
  label:not(.confirmation) { display: block; margin-bottom: 6px; font-weight: 700; }
  textarea { display: block; width: 100%; min-height: 260px; resize: vertical; padding: 12px; border: 1px solid #809188; border-radius: 7px; background: #fff; color: var(--ink); }
  .button { min-height: 44px; padding: 10px 18px; border: 2px solid var(--bergen-green); border-radius: 7px; font-weight: 700; cursor: pointer; }
  .button.primary { margin-top: 14px; background: var(--bergen-green); color: #fff; }
  .button.secondary { background: #fff; color: var(--bergen-green-dark); }
  .button:disabled { cursor: not-allowed; opacity: .5; }
  dl { display: grid; grid-template-columns: 160px 1fr; gap: 5px 14px; }
  dt { font-weight: 700; }
  dd { margin: 0; }
  .message-group { margin-top: 14px; padding: 12px 16px; border-left: 5px solid var(--bergen-green); background: var(--soft); }
  .message-group.error { border-color: var(--error); background: #fff0f0; }
  .message-group.warning { border-color: var(--warning); background: #fff8e8; }
  .message-group h3 { margin: 0 0 6px; font-size: 1rem; }
  .message-group ul { margin: 0; padding-left: 22px; }
  .confirmation { display: flex; gap: 10px; align-items: flex-start; margin: 20px 0; padding: 15px; border: 2px solid var(--bergen-green); border-radius: 8px; background: var(--soft); font-weight: 700; }
  .confirmation input { width: 22px; height: 22px; flex: 0 0 auto; }
  .download-panel { padding-top: 18px; border-top: 1px solid var(--line); }
  .support-note { padding: 16px; background: #fffaf0; }
  .status { min-height: 28px; margin-top: 16px; font-weight: 700; }
  .status[data-tone="error"] { color: var(--error); }

  @media (max-width: 640px) {
    .page-width { width: min(100% - 20px, 960px); }
    .site-header { padding: 22px 0; }
    main { padding-top: 18px; }
    .steps { grid-template-columns: 1fr; }
    .card { padding: 18px; }
    .card-heading, .download-panel { display: block; }
    .card-heading .button { width: 100%; margin: 12px 0 0; }
    .download-panel .button { width: 100%; }
    dl { grid-template-columns: 1fr; }
    dd { margin-bottom: 8px; }
  }
</style>
